<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>clippings 设置</title>
<link rel="stylesheet" href="options.css">
</head>
<body>
<main>
	<header class="head">
		<img src="../icons/48.png" width="28" height="28" alt="">
		<h1>clippings 设置</h1>
	</header>

	<section class="block">
		<label class="title-row">
			<h2>图床（阿里云 OSS）</h2>
			<input type="checkbox" class="switch" id="enabled">
		</label>
		<p class="note">把正文里的图转存到你自己的 OSS，Markdown 里换成图床地址。小红书的图片链接过几天就失效，豆瓣、微博有防盗链，转存后长期能看。单张失败保留原链接。</p>

		<div id="fields">
			<div class="grid">
				<label class="field">AccessKey ID<input id="accessKeyId" type="text" spellcheck="false" autocomplete="off"></label>
				<label class="field">AccessKey Secret<input id="accessKeySecret" type="password" spellcheck="false" autocomplete="new-password"></label>
				<label class="field">Bucket<input id="bucket" type="text" spellcheck="false" autocomplete="off"></label>
				<label class="field">Region<input id="region" type="text" spellcheck="false" autocomplete="off" placeholder="oss-cn-shenzhen"></label>
				<label class="field">路径前缀<input id="path" type="text" spellcheck="false" autocomplete="off" placeholder="clippings/"></label>
				<label class="field">自定义域名（可选）<input id="customDomain" type="text" spellcheck="false" autocomplete="off" placeholder="https://img.example.com"></label>
			</div>
			<p class="note">Bucket 要是公共读，图片才能直接打开。建议用只有 <code>oss:PutObject</code> 权限、限定到这个 bucket 和前缀的 RAM 子账号。密钥只存在这个浏览器里，不会同步。</p>

			<div class="field">「下载 HTML」的图片
				<label class="radio"><input type="radio" name="htmlImages" value="upload"> 转存图床（文件小）</label>
				<label class="radio"><input type="radio" name="htmlImages" value="base64"> 塞进文件（断网也能看，文件大）</label>
			</div>

			<div class="actions">
				<button class="btn ghost" id="probe" type="button">测试上传</button>
				<span class="status" id="status"></span>
			</div>
		</div>
	</section>
</main>
<script type="module" src="options.js"></script>
</body>
</html>
